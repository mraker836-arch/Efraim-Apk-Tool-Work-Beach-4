name: EFRAIM APK Workbench Android Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development
          - dry_run
      create_github_release:
        description: 'Publish formal GitHub Release with APK/AAB assets'
        required: true
        default: false
        type: boolean
      custom_release_notes:
        description: 'Custom Release Notes (optional override)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  detect-and-validate:
    name: 🔍 Project Detection & Validation
    runs-on: ubuntu-latest
    outputs:
      project_type: ${{ steps.detect.outputs.project_type }}
      app_id: ${{ steps.validate.outputs.app_id }}
      version_name: ${{ steps.validate.outputs.version_name }}
      version_code: ${{ steps.validate.outputs.version_code }}
      is_release_tag: ${{ steps.release_check.outputs.is_release_tag }}
      should_publish: ${{ steps.release_check.outputs.should_publish }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🕵️ Detect Project Type
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "project_type=flutter" >> $GITHUB_OUTPUT
            echo "Detected Flutter project architecture."
          elif [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "project_type=android_native" >> $GITHUB_OUTPUT
            echo "Detected Native Android Gradle (Kotlin/Java) architecture."
          else
            echo "project_type=unknown" >> $GITHUB_OUTPUT
            echo "::error::Unsupported project structure."
            exit 1
          fi

      - name: 📋 Extract & Validate Package Identity & Version
        id: validate
        run: |
          if [ "${{ steps.detect.outputs.project_type }}" = "flutter" ]; then
            VERSION=$(grep -E '^version:' pubspec.yaml 2>/dev/null | head -n 1 | awk '{print $2}')
            VERSION_NAME=$(echo "$VERSION" | cut -d '+' -f 1)
            if [[ "$VERSION" == *"+"* ]]; then
              VERSION_CODE=$(echo "$VERSION" | cut -d '+' -f 2)
            else
              VERSION_CODE="1"
            fi
            APP_ID=$(grep 'applicationId' android/app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*applicationId[ =]+//; s/[\",{} ]//g')
          else
            APP_ID=$(grep -E 'applicationId' app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*applicationId[ =]+//; s/[\",{} ]//g')
            VERSION_NAME=$(grep -E 'versionName' app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*versionName[ =]+//; s/[\",{} ]//g')
            VERSION_CODE=$(grep -E 'versionCode' app/build.gradle* 2>/dev/null | head -n 1 | sed -E 's/.*versionCode[ =]+//; s/[\",{} ]//g')
          fi

          if [ -z "$APP_ID" ] || [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Failed to extract package identity or version from build configuration."
            exit 1
          fi

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Identified Application ID: $APP_ID, Version Name: $VERSION_NAME, Version Code: $VERSION_CODE"

      - name: 🚦 Determine Release Publication Intent
        id: release_check
        run: |
          IS_TAG="false"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_TAG="true"
          fi
          
          SHOULD_PUB="false"
          if [ "$IS_TAG" = "true" ] || [ "${{ github.event.inputs.create_github_release }}" = "true" ]; then
            SHOULD_PUB="true"
          fi
          
          echo "is_release_tag=$IS_TAG" >> $GITHUB_OUTPUT
          echo "should_publish=$SHOULD_PUB" >> $GITHUB_OUTPUT

  build-and-test:
    name: ⚙️ Build, Test & Package Android Artifacts
    needs: detect-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔍 Diagnose and Repair Gradle Wrapper
        run: |
          java -version
          ls -lh gradle/wrapper/ || true
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            file gradle/wrapper/gradle-wrapper.jar || true
          fi
          # If gradle-wrapper.jar is missing or invalid zip archive, regenerate it
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Repairing Gradle wrapper to official Gradle 9.3.1 distribution..."
            mkdir -p gradle/wrapper
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          fi

      - name: 🔑 Grant Gradle execute permission
        run: |
          chmod +x gradlew
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: 🦋 Setup Flutter (if Flutter project)
        if: needs.detect-and-validate.outputs.project_type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies & Validate Gradle Wrapper
        run: |
          if [ "${{ needs.detect-and-validate.outputs.project_type }}" = "flutter" ]; then
            flutter pub get
          else
            echo "Validating Gradle wrapper and dependencies..."
            ./gradlew --version
            ./gradlew clean
          fi

      - name: 🧐 Static Analysis & Lint Checks
        run: |
          if [ "${{ needs.detect-and-validate.outputs.project_type }}" = "flutter" ]; then
            flutter analyze
          else
            echo "Running static analysis and code checks..."
            ./gradlew :app:lintDebug --stacktrace
          fi

      - name: 🧪 Execute Unit & Integration Tests
        run: |
          if [ "${{ needs.detect-and-validate.outputs.project_type }}" = "flutter" ]; then
            flutter test
          else
            echo "Running Android unit and Robolectric tests..."
            ./gradlew :app:testDebugUnitTest --stacktrace
          fi

      - name: 🛠️ Build Android Debug APK
        run: |
          if [ "${{ needs.detect-and-validate.outputs.project_type }}" != "flutter" ]; then
            echo "Building Android Debug APK..."
            ./gradlew :app:assembleDebug --stacktrace
          fi

      - name: 🔐 Configure Release Keystore (if secrets provided)
        id: signing_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=${KEY_ALIAS:-upload}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}" >> $GITHUB_ENV
            echo "has_release_keystore=true" >> $GITHUB_OUTPUT
            echo "✅ Release signing keystore securely configured."
          else
            echo "has_release_keystore=false" >> $GITHUB_OUTPUT
            echo "⚠️ Production release signing configuration not provided in secrets. Building debug/unsigned release artifacts."
          fi

      - name: 🔨 Build Android Release APK & AAB
        id: build_artifacts
        run: |
          mkdir -p output_artifacts
          
          if [ "${{ needs.detect-and-validate.outputs.project_type }}" = "flutter" ]; then
            flutter build apk --release
            flutter build appbundle --release || true
            cp build/app/outputs/flutter-apk/app-release.apk output_artifacts/efraim-apk-workbench-release.apk || cp build/app/outputs/apk/release/*.apk output_artifacts/efraim-apk-workbench-release.apk
            cp build/app/outputs/bundle/release/*.aab output_artifacts/efraim-apk-workbench-release.aab || true
          else
            echo "Building Android Native APK with Gradle..."
            ./gradlew :app:assembleRelease --stacktrace
            
            # Locate generated release APK
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
            if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
              APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
            fi
            if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
              echo "::error::CRITICAL: Android APK output not found after build."
              exit 1
            fi
            
            cp "$APK_PATH" output_artifacts/efraim-apk-workbench-release.apk
            echo "Copied APK from $APK_PATH to output_artifacts/efraim-apk-workbench-release.apk"
            
            # Try building bundle AAB if supported
            ./gradlew :app:bundleRelease || true
            AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" 2>/dev/null | head -n 1 || true)
            if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
              cp "$AAB_PATH" output_artifacts/efraim-apk-workbench-release.aab
              echo "Copied AAB from $AAB_PATH to output_artifacts/efraim-apk-workbench-release.aab"
            fi
          fi

      - name: 🔍 Artifact Validation & Signing Verification
        run: |
          APK_FILE="output_artifacts/efraim-apk-workbench-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK artifact validation failed - file missing!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE" || stat -f%z "$APK_FILE")
          echo "Validated Release APK size: $FILE_SIZE bytes"
          
          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "::error::Release APK size is abnormally small (<10KB) - artifact corrupted!"
            exit 1
          fi
          
          echo "Verifying cryptographic integrity with jarsigner / apksigner..."
          jarsigner -verify -verbose -certs "$APK_FILE" | head -n 20 || echo "Unsigned/Development key signature validated"

      - name: 🧮 Compute SHA-256 Checksums
        run: |
          cd output_artifacts
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sha256 ]] && [[ "$f" != *.json ]]; then
              sha256sum "$f" > "${f}.sha256"
              echo "Generated SHA-256 for $f: $(cat ${f}.sha256 | awk '{print $1}')"
            fi
          done
          cd ..

      - name: 📝 Generate Release Metadata JSON
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_SHA=$(cat output_artifacts/efraim-apk-workbench-release.apk.sha256 | awk '{print $1}')
          APK_SIZE=$(stat -c%s output_artifacts/efraim-apk-workbench-release.apk || stat -f%z output_artifacts/efraim-apk-workbench-release.apk)
          
          cat <<EOF > output_artifacts/release-metadata.json
          {
            "product_name": "EFRAIM APK WORKBENCH TOOL M",
            "short_name": "EFRAIM APK WORKBENCH",
            "application_id": "${{ needs.detect-and-validate.outputs.app_id }}",
            "version_name": "${{ needs.detect-and-validate.outputs.version_name }}",
            "version_code": ${{ needs.detect-and-validate.outputs.version_code }},
            "build_timestamp": "$BUILD_DATE",
            "git_commit_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "pipeline": "GitHub Actions Android Release Pipeline (Phase 9C)",
            "artifacts": [
              {
                "name": "efraim-apk-workbench-release.apk",
                "type": "application/vnd.android.package-archive",
                "size_bytes": $APK_SIZE,
                "sha256": "$APK_SHA"
              }
            ]
          }
          EOF
          cat output_artifacts/release-metadata.json

      - name: 📤 Upload Build Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: efraim-apk-workbench-android-artifacts
          path: output_artifacts/
          retention-days: 30

      - name: 🏷️ Publish Official GitHub Release
        if: needs.detect-and-validate.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', needs.detect-and-validate.outputs.version_name) }}
          name: "EFRAIM APK WORKBENCH TOOL M v${{ needs.detect-and-validate.outputs.version_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## EFRAIM APK WORKBENCH TOOL M — Official Release
            **Local-First APK Build & Rebuild Engine**

            ### 🚀 Release Information
            - **Product Name:** EFRAIM APK WORKBENCH TOOL M
            - **Application ID:** `${{ needs.detect-and-validate.outputs.app_id }}`
            - **Version:** `${{ needs.detect-and-validate.outputs.version_name }}` (Build Code: `${{ needs.detect-and-validate.outputs.version_code }}`)
            - **Commit SHA:** `${{ github.sha }}`
            - **Architecture:** Local-first on-device APK Lab, DIANA AI, Native DEX Inspector, 12-Stage Rebuilder, and RSA Signer.

            ### 📦 Downloadable Assets
            - `efraim-apk-workbench-release.apk` (Android Application Package)
            - `efraim-apk-workbench-release.apk.sha256` (Cryptographic verification checksum)
            - `release-metadata.json` (Machine-readable build bill of materials)

            ### 🛡️ Security & Integrity
            Verify artifact authenticity via:
            ```bash
            sha256sum -c efraim-apk-workbench-release.apk.sha256
            ```
          files: |
            output_artifacts/efraim-apk-workbench-release.apk
            output_artifacts/efraim-apk-workbench-release.apk.sha256
            output_artifacts/release-metadata.json
            output_artifacts/*.aab
            output_artifacts/*.aab.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          

